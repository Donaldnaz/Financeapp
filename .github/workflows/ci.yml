name: FinanceApp DR CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_SECONDARY_REGION: us-west-2
  ECR_DEV_REPOSITORY: financeapp-dr-dev-repo
  ECS_DEV_PRIMARY_CLUSTER: financeapp-dr-dev-primary-cluster
  ECS_DEV_PRIMARY_SERVICE: financeapp-dr-dev-primary-service
  ECS_DEV_SECONDARY_CLUSTER: financeapp-dr-dev-secondary-cluster
  ECS_DEV_SECONDARY_SERVICE: financeapp-dr-dev-secondary-service

jobs:
  quality:
    name: Java Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test Java
        working-directory: app
        run: mvn -B clean verify

  deploy-dev:
    name: Deploy DEV (ECR + ECS)
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push dev image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_DEV_REPOSITORY:$IMAGE_TAG" ./app
          docker tag "$ECR_REGISTRY/$ECR_DEV_REPOSITORY:$IMAGE_TAG" "$ECR_REGISTRY/$ECR_DEV_REPOSITORY:latest"
          aws ecr describe-repositories --repository-names "$ECR_DEV_REPOSITORY" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "$ECR_DEV_REPOSITORY" >/dev/null
          docker push "$ECR_REGISTRY/$ECR_DEV_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_DEV_REPOSITORY:latest"

      - name: Roll out primary ECS service
        run: |
          aws ecs update-service \
            --cluster "$ECS_DEV_PRIMARY_CLUSTER" \
            --service "$ECS_DEV_PRIMARY_SERVICE" \
            --force-new-deployment \
            --region "$AWS_REGION"

      - name: Wait for ECR replication to secondary region
        run: sleep 30

      - name: Roll out secondary ECS service
        run: |
          aws ecs update-service \
            --cluster "$ECS_DEV_SECONDARY_CLUSTER" \
            --service "$ECS_DEV_SECONDARY_SERVICE" \
            --force-new-deployment \
            --region "$AWS_SECONDARY_REGION"

      - name: Wait for ECS services to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_DEV_PRIMARY_CLUSTER" \
            --services "$ECS_DEV_PRIMARY_SERVICE" \
            --region "$AWS_REGION"
          aws ecs wait services-stable \
            --cluster "$ECS_DEV_SECONDARY_CLUSTER" \
            --services "$ECS_DEV_SECONDARY_SERVICE" \
            --region "$AWS_SECONDARY_REGION"
