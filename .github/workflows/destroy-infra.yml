name: Destroy DEV Infrastructure

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type destroy to confirm'
        required: true
        type: string

permissions:
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  destroy-dev:
    name: Terraform destroy (dev)
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'destroy'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Empty ECR repository (allows delete)
        run: |
          REPO=financeapp-dr-dev-repo
          aws ecr describe-repositories --repository-names "$REPO" --region "$AWS_REGION" >/dev/null 2>&1 || exit 0
          IMAGE_IDS=$(aws ecr list-images --repository-name "$REPO" --region "$AWS_REGION" --query 'imageIds' --output json)
          if [ "$IMAGE_IDS" != "[]" ] && [ "$IMAGE_IDS" != "null" ]; then
            aws ecr batch-delete-image --repository-name "$REPO" --region "$AWS_REGION" --image-ids "$IMAGE_IDS"
          fi

      - name: Terraform destroy dev
        working-directory: infra/terraform/environments/dev
        run: |
          terraform init -input=false
          terraform destroy -input=false -auto-approve

      - name: Terraform destroy prod (no-op if already gone)
        working-directory: infra/terraform/environments/prod
        run: |
          terraform init -input=false
          terraform destroy -input=false -auto-approve || true
