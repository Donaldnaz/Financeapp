server:
  port: 8080

spring:
  application:
    name: dr-api
  thymeleaf:
    cache: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

app:
  region: ${AWS_REGION:local}
  storage:
    type: ${APP_STORAGE_TYPE:memory}
    table-name: ${TRANSACTIONS_TABLE:transactions-global}
  seed:
    enabled: ${APP_SEED_ENABLED:true}
  cookie:
    secure: ${APP_COOKIE_SECURE:false}
  jwt:
    secret: ${APP_JWT_SECRET:dev-only-please-rotate-this-key-32bytes!!}
    validityMinutes: 60
