server:
  port: 8080
  address: 0.0.0.0

spring:
  application:
    name: dr-api
  thymeleaf:
    cache: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

app:
  region: ${AWS_REGION:local}
  storage:
    type: ${APP_STORAGE_TYPE:memory}
    table-name: ${TRANSACTIONS_TABLE:transactions-global}
  seed:
    enabled: ${APP_SEED_ENABLED:true}
  cookie:
    secure: ${APP_COOKIE_SECURE:false}
  jwt:
    secret: ${APP_JWT_SECRET:dev-only-please-rotate-this-key-32bytes!!}
    validityMinutes: 60
  assistant:
    enabled: ${APP_ASSISTANT_ENABLED:true}
    provider: ${ASSISTANT_PROVIDER:ollama}
    llm:
      api-key: ${ASSISTANT_API_KEY:${OPENAI_API_KEY:ollama}}
      model: ${ASSISTANT_MODEL:${OPENAI_MODEL:llama3.2:3b}}
      base-url: ${ASSISTANT_BASE_URL:${OPENAI_BASE_URL:http://localhost:11434/v1}}
