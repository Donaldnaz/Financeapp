<div xmlns:th="http://www.thymeleaf.org" th:fragment="assistantChat">
  <div id="itrust-assistant-root" class="fixed bottom-20 lg:bottom-6 right-4 z-40 flex flex-col items-end gap-3">
    <!-- Chat panel -->
    <div id="itrust-assistant-panel"
         class="hidden w-[min(100vw-2rem,380px)] h-[min(70vh,520px)] flex flex-col rounded-2xl bg-white shadow-elevated ring-1 ring-slate-200/80 overflow-hidden">
      <div class="flex items-center justify-between gap-3 px-4 py-3 bg-bank-900 text-white border-b border-white/10">
        <div class="flex items-center gap-2">
          <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-bank-700 ring-1 ring-gold-400/30">
            <svg class="h-4 w-4 text-gold-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8.625 9.75a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H8.25m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H12m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0h-.375M21 12c0 4.556-4.03 8.25-9 8.25a9.764 9.764 0 01-2.555-.337A5.972 5.972 0 015.41 20.97a5.969 5.969 0 01-.474-.065 4.48 4.48 0 00.978-2.025c.09-.457-.133-.901-.467-1.226C3.93 16.178 3 14.189 3 12c0-4.556 4.03-8.25 9-8.25s9 3.694 9 8.25z"/>
            </svg>
          </span>
          <div>
            <div class="text-sm font-semibold">iTrust Assistant</div>
            <div class="text-[10px] text-white/50 uppercase tracking-wider">Powered by your local LLM</div>
          </div>
        </div>
        <button type="button" id="itrust-assistant-close" class="rounded-lg p-1.5 text-white/70 hover:bg-white/10 hover:text-white" aria-label="Close assistant">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <div id="itrust-assistant-messages" class="flex-1 overflow-y-auto px-4 py-4 space-y-3 bg-[#f8fafb]"></div>
      <div id="itrust-assistant-loading" class="hidden border-t border-slate-100 bg-slate-50 px-4 py-2 text-xs text-slate-500">
        Checking your account…
      </div>

      <div id="itrust-assistant-pending" class="hidden border-t border-amber-200 bg-amber-50 px-4 py-3">
        <p class="text-xs font-medium text-amber-900">Confirm this action</p>
        <p id="itrust-assistant-pending-summary" class="mt-1 text-sm text-amber-800"></p>
        <div class="mt-3 flex gap-2">
          <button type="button" id="itrust-assistant-confirm" class="flex-1 rounded-lg bg-bank-700 px-3 py-2 text-xs font-semibold text-white hover:bg-bank-800">Confirm</button>
          <button type="button" id="itrust-assistant-cancel-pending" class="rounded-lg px-3 py-2 text-xs font-medium text-amber-900 hover:bg-amber-100">Cancel</button>
        </div>
      </div>

      <form id="itrust-assistant-form" class="border-t border-slate-200 bg-white p-3">
        <div id="itrust-assistant-suggestions" class="mb-3 flex flex-wrap gap-2">
          <button th:each="query : ${assistantPopularQueries}" type="button"
                  class="itrust-assistant-suggestion rounded-full bg-bank-50 px-3 py-1.5 text-xs font-medium text-bank-800 ring-1 ring-bank-200 hover:bg-bank-100"
                  th:text="${query.label}"
                  th:attr="data-message=${query.message}">Balance</button>
        </div>
        <div class="flex gap-2">
          <input id="itrust-assistant-input" type="text" maxlength="500"
                 placeholder="Ask about balance, transfers, deposits…"
                 class="flex-1 rounded-xl border border-slate-200 px-3 py-2 text-sm focus:border-bank-500 focus:outline-none focus:ring-2 focus:ring-bank-500/20" />
          <button type="submit" id="itrust-assistant-send"
                  class="rounded-xl bg-bank-700 px-4 py-2 text-sm font-semibold text-white hover:bg-bank-800 disabled:opacity-50">
            Send
          </button>
        </div>
        <p id="itrust-assistant-error" class="hidden mt-2 text-xs text-red-600"></p>
      </form>
    </div>

    <!-- Toggle button -->
    <button type="button" id="itrust-assistant-toggle"
            class="flex h-14 w-14 items-center justify-center rounded-full bg-bank-800 text-gold-400 shadow-elevated ring-2 ring-gold-400/30 hover:bg-bank-700 transition"
            aria-label="Open iTrust assistant">
      <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8.625 9.75a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H8.25m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H12m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0h-.375M21 12c0 4.556-4.03 8.25-9 8.25a9.764 9.764 0 01-2.555-.337A5.972 5.972 0 015.41 20.97a5.969 5.969 0 01-.474-.065 4.48 4.48 0 00.978-2.025c.09-.457-.133-.901-.467-1.226C3.93 16.178 3 14.189 3 12c0-4.556 4.03-8.25 9-8.25s9 3.694 9 8.25z"/>
      </svg>
    </button>
  </div>

  <script th:inline="javascript">
    (function () {
      const messagesEl = document.getElementById('itrust-assistant-messages');
      const panelEl = document.getElementById('itrust-assistant-panel');
      const toggleEl = document.getElementById('itrust-assistant-toggle');
      const closeEl = document.getElementById('itrust-assistant-close');
      const formEl = document.getElementById('itrust-assistant-form');
      const inputEl = document.getElementById('itrust-assistant-input');
      const sendEl = document.getElementById('itrust-assistant-send');
      const errorEl = document.getElementById('itrust-assistant-error');
      const pendingEl = document.getElementById('itrust-assistant-pending');
      const pendingSummaryEl = document.getElementById('itrust-assistant-pending-summary');
      const confirmEl = document.getElementById('itrust-assistant-confirm');
      const cancelPendingEl = document.getElementById('itrust-assistant-cancel-pending');
      const loadingEl = document.getElementById('itrust-assistant-loading');
      const suggestionsEl = document.getElementById('itrust-assistant-suggestions');

      const history = [];
      let pendingActionId = null;
      let open = false;

      function setOpen(next) {
        open = next;
        panelEl.classList.toggle('hidden', !open);
      }

      function appendMessage(role, text) {
        const wrap = document.createElement('div');
        wrap.className = role === 'user' ? 'flex justify-end' : 'flex justify-start';
        const bubble = document.createElement('div');
        bubble.className = role === 'user'
          ? 'max-w-[85%] rounded-2xl rounded-br-md bg-bank-700 px-3 py-2 text-sm text-white'
          : 'max-w-[85%] rounded-2xl rounded-bl-md bg-white px-3 py-2 text-sm text-slate-700 ring-1 ring-slate-200/80';
        bubble.textContent = text;
        wrap.appendChild(bubble);
        messagesEl.appendChild(wrap);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function appendLinks(links) {
        if (!links || !links.length) return;
        const wrap = document.createElement('div');
        wrap.className = 'flex flex-wrap gap-2';
        links.forEach(function (link) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'rounded-lg bg-bank-50 px-3 py-1.5 text-xs font-medium text-bank-800 ring-1 ring-bank-200 hover:bg-bank-100';
          btn.textContent = link.label || 'Open';
          btn.addEventListener('click', function () {
            window.location.href = link.href;
          });
          wrap.appendChild(btn);
        });
        messagesEl.appendChild(wrap);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function showError(message) {
        if (!message) {
          errorEl.classList.add('hidden');
          errorEl.textContent = '';
          return;
        }
        errorEl.textContent = message;
        errorEl.classList.remove('hidden');
      }

      function setPending(action) {
        if (!action) {
          pendingActionId = null;
          pendingEl.classList.add('hidden');
          pendingSummaryEl.textContent = '';
          return;
        }
        pendingActionId = action.id;
        pendingSummaryEl.textContent = action.summary || 'Confirm this banking action';
        pendingEl.classList.remove('hidden');
      }

      function setSuggestionsVisible(visible) {
        if (!suggestionsEl) return;
        suggestionsEl.classList.toggle('hidden', !visible);
      }

      function setLoading(loading) {
        sendEl.disabled = loading;
        confirmEl.disabled = loading;
        inputEl.disabled = loading;
        loadingEl.classList.toggle('hidden', !loading);
      }

      async function postJson(url, body) {
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify(body)
        });
        const text = await response.text();
        let data = null;
        try {
          data = text ? JSON.parse(text) : null;
        } catch (e) {
          data = null;
        }
        if (!response.ok) {
          const message = (data && (data.message || data.error)) || text || 'Request failed';
          throw new Error(message);
        }
        return data;
      }

      async function sendChat(text) {
        history.push({ role: 'user', content: text });
        if (history.length > 10) {
          history.splice(0, history.length - 10);
        }
        appendMessage('user', text);
        setSuggestionsVisible(false);
        setLoading(true);
        showError('');
        try {
          const data = await postJson('/api/assistant/chat', { messages: history });
          history.push({ role: 'assistant', content: data.reply });
          appendMessage('assistant', data.reply);
          appendLinks(data.links);
          setPending(data.pendingAction);
        } catch (err) {
          if (history.length && history[history.length - 1].role === 'user') {
            history.pop();
          }
          showError(err.message || 'Assistant unavailable');
        } finally {
          setLoading(false);
        }
      }

      async function confirmPending() {
        if (!pendingActionId) return;
        setLoading(true);
        showError('');
        try {
          const data = await postJson('/api/assistant/confirm', { pendingActionId: pendingActionId });
          history.push({ role: 'assistant', content: data.reply });
          appendMessage('assistant', data.reply);
          appendLinks(data.links);
          setPending(null);
        } catch (err) {
          showError(err.message || 'Confirmation failed');
        } finally {
          setLoading(false);
        }
      }

      toggleEl.addEventListener('click', function () {
        setOpen(!open);
        if (open && messagesEl.children.length === 0) {
          appendMessage('assistant', 'Hi! I can check your balance, show recent activity, link you to banking pages, or help with transfers, deposits, and withdrawals (with confirmation).');
        }
      });
      closeEl.addEventListener('click', function () { setOpen(false); });
      document.getElementById('itrust-assistant-open-nav')?.addEventListener('click', function (e) {
        e.preventDefault();
        setOpen(true);
      });

      formEl.addEventListener('submit', function (e) {
        e.preventDefault();
        const text = inputEl.value.trim();
        if (!text) return;
        inputEl.value = '';
        sendChat(text);
      });

      suggestionsEl?.querySelectorAll('.itrust-assistant-suggestion').forEach(function (button) {
        button.addEventListener('click', function () {
          const text = button.getAttribute('data-message');
          if (!text) return;
          sendChat(text);
        });
      });

      confirmEl.addEventListener('click', confirmPending);
      cancelPendingEl.addEventListener('click', function () { setPending(null); });
    })();
  </script>
</div>
