<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Deposit', ~{::section})}">
<body>
<section class="max-w-2xl mx-auto">
  <a th:href="@{/dashboard}" class="inline-flex items-center gap-1 text-sm font-medium text-bank-700 hover:text-bank-900 mb-6">
    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/></svg>
    Back to overview
  </a>

  <div class="bg-white rounded-3xl border border-slate-200/80 shadow-card overflow-hidden">
    <div class="px-8 py-6 bg-gradient-to-r from-emerald-700 to-emerald-600 text-white">
      <h2 class="text-xl font-semibold">Deposit with demo card</h2>
      <p class="text-sm text-emerald-100 mt-1">Funds are credited instantly — demo only, no real charges</p>
    </div>

    <div class="p-8">
      <div class="flex items-center justify-between rounded-2xl bg-emerald-50 border border-emerald-100 px-5 py-4 mb-6">
        <span class="text-sm text-emerald-800">Current balance</span>
        <span class="text-xl font-semibold text-emerald-900 tabular-nums">
          $<span th:text="${#numbers.formatDecimal(account.balance(), 1, 'COMMA', 2, 'POINT')}">0.00</span>
        </span>
      </div>

      <div th:if="${demoCard != null}" class="debit-card rounded-2xl p-6 text-white mb-6">
        <div class="flex justify-between items-start mb-8">
          <div>
            <p class="text-[10px] uppercase tracking-[0.2em] text-white/50">iTrust demo card</p>
            <p class="text-sm font-medium mt-1" th:text="${demoCard.brand()}">VISA</p>
          </div>
          <div class="h-8 w-12 rounded bg-gradient-to-br from-gold-300 to-gold-500 opacity-80"></div>
        </div>
        <p class="font-mono text-lg tracking-[0.15em] mb-4" th:text="${demoCard.maskedReference()}">**** **** **** 4242</p>
        <p class="text-xs text-white/50">Linked to your account · expires 12/30</p>
      </div>

      <div th:if="${demoCard == null}" class="mb-6 rounded-xl bg-amber-50 border border-amber-200 px-4 py-3 text-sm text-amber-800">
        No demo card on file. Contact support or re-open your account.
      </div>

      <div th:if="${error}" class="mb-5 flex gap-3 rounded-xl bg-rose-50 border border-rose-200/80 px-4 py-3 text-sm text-rose-800">
        <span th:text="${error}">error</span>
      </div>

      <form th:action="@{/deposit}" method="post" class="space-y-5" th:if="${demoCard != null}">
        <div>
          <label for="amount" class="block text-sm font-medium text-slate-700 mb-1.5">Amount to charge</label>
          <div class="relative">
            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 font-medium">$</span>
            <input id="amount" name="amount" type="number" min="0.01" step="0.01" required
                   class="input-bank pl-8 text-2xl font-semibold tabular-nums" placeholder="0.00" />
          </div>
        </div>
        <div>
          <label for="description" class="block text-sm font-medium text-slate-700 mb-1.5">Memo</label>
          <input id="description" name="description" type="text" maxlength="256" placeholder="Paycheck, refund, etc."
                 class="input-bank" />
        </div>
        <button type="submit" class="w-full py-3.5 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white font-semibold shadow-sm transition">
          Confirm deposit from card
        </button>
      </form>
    </div>
  </div>
</section>
</body>
</html>
